# Production server
server.port=${PORT:8080}

# Database - provide all values through deployment environment variables
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT - set a strong private JWT_SECRET in the deployment environment
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS}
